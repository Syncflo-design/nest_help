[project]
name = "nest_help"
authors = [{ name = "NestERP", email = "info@nesterp.com" }]
description = "Contextual help system for the NestERP platform"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "nest_help"


[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
